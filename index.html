<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Was koche ich?</title>
<meta name="description" content="Gerichte nach Mahlzeit, Budget und Zeit vorschlagen – mit Einkaufsliste.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Was koche ich?">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#f7f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141311" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#f7f4ef; --surface:#ffffff; --surface2:#efeae2; --line:#e4ddd2;
  --text:#1d1b18; --muted:#6f6a62; --accent:#c8430b; --accent-ink:#ffffff;
  --accent-soft:#fbe6da; --ok:#2f7d4f; --ok-soft:#dcefe3; --warn:#9a6a00;
  --shadow:0 1px 2px rgba(40,30,20,.06),0 4px 14px rgba(40,30,20,.06);
  --r:16px; --tabh:58px;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141311; --surface:#1f1d1a; --surface2:#2a2724; --line:#34302b;
  --text:#f2efe9; --muted:#a49d92; --accent:#ff7a3d; --accent-ink:#1a0d05;
  --accent-soft:#3a2418; --ok:#5fc48a; --ok-soft:#1d3326; --warn:#e2b04a;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
  padding:calc(var(--st) + 8px) calc(var(--sr) + 16px) calc(var(--tabh) + var(--sb) + 24px) calc(var(--sl) + 16px);
  overscroll-behavior-y:none}
h1,h2,h3{font-family:ui-rounded,-apple-system,"SF Pro Rounded",system-ui,sans-serif;margin:0;letter-spacing:-.01em}
h1{font-size:30px;font-weight:800}
h2{font-size:22px;font-weight:750}
h3{font-size:18px;font-weight:700}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.muted{color:var(--muted)}
.small{font-size:13px}
.hidden{display:none!important}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:6px 0 14px}
.topbar .sub{font-size:14px;color:var(--muted);margin-top:2px}
section.tab{display:none}
section.tab.active{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* Filter */
.panel{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.fgroup+.fgroup{margin-top:14px}
.flabel{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:0 0 7px 2px;display:flex;justify-content:space-between;gap:8px}
.flabel span:last-child{text-transform:none;letter-spacing:0;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{min-height:44px;padding:0 14px;border-radius:12px;background:var(--surface2);font-size:15px;font-weight:550;display:inline-flex;align-items:center;gap:6px;transition:background .12s,color .12s}
.seg .chip small{font-size:12px;font-weight:500;opacity:.8;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chip.sm{min-height:36px;padding:0 11px;font-size:14px;border-radius:10px}
.seg{display:grid;gap:6px;grid-auto-flow:column;grid-auto-columns:1fr}
.seg .chip{min-height:50px;flex-direction:column;gap:0;justify-content:center;padding:0 6px;text-align:center;line-height:1.15}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:44px;height:44px;border-radius:12px;background:var(--surface2);font-size:22px;font-weight:600;display:grid;place-items:center}
.stepper button:disabled{opacity:.35}
.stepper output{min-width:92px;text-align:center;font-weight:700;font-size:17px}
.excl{display:flex;gap:8px}
.excl input{flex:1;min-width:0;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font-size:16px}
.excl button{height:44px;padding:0 16px;border-radius:12px;background:var(--surface2);font-weight:600}
.tagchip{display:inline-flex;align-items:center;gap:4px;min-height:36px;padding:0 4px 0 12px;border-radius:999px;background:var(--accent-soft);font-size:14px;font-weight:550}
.tagchip button{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:18px;color:var(--muted)}
#exclList{margin-top:8px}
#exclList:empty{display:none}
.cta{width:100%;min-height:56px;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-size:18px;font-weight:750;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 6px 18px rgba(200,67,11,.25)}
.cta:active{transform:scale(.985)}
.cta .cnt{font-size:14px;font-weight:600;opacity:.85}
.btn{min-height:44px;padding:0 16px;white-space:nowrap;border-radius:12px;background:var(--surface2);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{color:#c0392b}
.btn:disabled{opacity:.4}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1}

/* Karten */
#results{margin-top:18px;scroll-margin-top:calc(var(--st) + 10px)}
.reshead{display:flex;align-items:center;justify-content:space-between;margin:0 2px 10px}
.cards{display:grid;gap:10px}
.card{display:block;width:100%;text-align:left;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 14px 12px;position:relative}
.card:active{transform:scale(.99)}
.card h3{margin:6px 30px 8px 0;font-size:18px;line-height:1.25}
.card .star{position:absolute;top:12px;right:12px;color:var(--accent);font-size:18px}
.pills{display:flex;flex-wrap:wrap;gap:5px}
.pill{font-size:12px;font-weight:650;padding:3px 8px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.pill.veg{background:var(--ok-soft);color:var(--ok)}
.pill.cheap{background:var(--accent-soft);color:var(--accent)}
.pill.recent{background:transparent;border:1px dashed var(--line)}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;color:var(--muted)}
.meta b{color:var(--text);font-weight:650}
.ico{width:15px;height:15px;vertical-align:-2px;margin-right:4px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:4px}

/* Sheet */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:calc(var(--st) + 6px) calc(var(--sr) + 16px) calc(var(--sb) + 96px) calc(var(--sl) + 16px);
  transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.sheet-top{position:sticky;top:calc(-1 * var(--st) - 6px);margin:0 -16px;padding:calc(var(--st) + 6px) 16px 8px;background:var(--bg);display:flex;justify-content:space-between;z-index:2}
.iconbtn{width:44px;height:44px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:20px}
.iconbtn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.stat{background:var(--surface);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow)}
.stat .k{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.stat .v{font-size:17px;font-weight:700;margin-top:2px}
.stat .x{font-size:13px;color:var(--muted)}
.ing{width:100%;border-collapse:collapse;font-size:15px}
.ing td{padding:9px 0;border-bottom:1px solid var(--line);vertical-align:top}
.ing td.a{white-space:nowrap;font-weight:650;padding-right:12px;width:1%}
.ing td.c{text-align:right;white-space:nowrap;color:var(--muted);padding-left:10px;font-variant-numeric:tabular-nums}
.ing tr.sum td{border-bottom:0;font-weight:700;color:var(--text);padding-top:10px}
.ing tr.pp td{border-bottom:0;padding-top:0;color:var(--muted)}
.hl td{font-size:14px}.hl td.c{padding-left:8px}
.hl tr.hd td{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;padding-top:4px}
.hl .pt{font-weight:700}.hl .p1{color:var(--ok)}.hl .p05{color:var(--warn)}.hl .p0{color:#c0392b}
.badge{font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;background:var(--surface2);color:var(--muted);margin-left:6px;vertical-align:1px}
ol.steps{padding:0;margin:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding:0 0 16px 44px}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:-2px;width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:800;display:grid;place-items:center;font-size:15px}
.tbadge{display:inline-block;margin-top:5px;font-size:13px;font-weight:650;color:var(--accent)}
.sheet h3.sec{margin:22px 0 8px}
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;gap:8px;padding:10px calc(var(--sr) + 16px) calc(var(--sb) + 10px) calc(var(--sl) + 16px);
  background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);
  transform:translateY(110%);visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility .28s}
.actionbar.open{transform:none;visibility:visible}
.actionbar .btn{flex:1;min-height:50px}


/* Swipe-Deck */
.deck{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scrollbar-width:none;
  margin:0 calc(-16px - var(--sr)) 0 calc(-16px - var(--sl));padding:4px calc(16px + var(--sr)) 12px calc(16px + var(--sl));scroll-padding-left:calc(16px + var(--sl))}
.deck::-webkit-scrollbar{display:none}
.dcard{flex:0 0 calc(100% - 30px);max-width:440px;scroll-snap-align:start;scroll-snap-stop:always;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;-webkit-user-select:none;user-select:none}
.dcard:only-child{flex-basis:100%}
.dcard:active{transform:scale(.99)}
.dimg{position:relative;aspect-ratio:400/260;flex:none}
.dimg svg,.hero svg,.fthumb svg{display:block;width:100%;height:100%}
.dtags{position:absolute;left:10px;top:10px;display:flex;gap:5px;flex-wrap:wrap}
.dtags .pill{background:rgba(255,255,255,.88);color:#3a3530}
.dfav{position:absolute;right:10px;top:8px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.88);display:grid;place-items:center;color:#c8430b;font-size:17px}
.dbody{padding:12px 14px 14px;display:flex;flex-direction:column;flex:1}
.dbody h3{font-size:19px;line-height:1.25;margin:0 0 10px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 0 10px}
.kpis div{background:var(--surface2);border-radius:10px;padding:7px 2px 6px;text-align:center;min-width:0}
.kpis b{display:block;font-size:15px;font-weight:750;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpis span{display:block;font-size:11px;color:var(--muted);white-space:nowrap}
.deckctl{display:flex;align-items:center;gap:12px}
.deckctl button{width:44px;height:44px;border-radius:50%;background:var(--surface2);font-size:24px;line-height:1;display:grid;place-items:center}
.deckctl button:disabled{opacity:.35}
.prog{flex:1;height:4px;border-radius:2px;background:var(--surface2);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);border-radius:2px;transition:width .2s}
.hero{border-radius:18px;overflow:hidden;aspect-ratio:400/260;margin:2px 0 12px;box-shadow:var(--shadow)}
.fcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:8px 12px 8px 8px}
.fthumb{width:104px;height:68px;border-radius:12px;overflow:hidden;flex:none}
.ftxt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.ftxt b{font-size:16px;line-height:1.25}
.ftxt span{font-size:13px;color:var(--muted)}
@media (prefers-color-scheme:dark){
  .bg1.mf{stop-color:#4a3622}.bg2.mf{stop-color:#2e2217}.bg1.ms{stop-color:#33402a}.bg2.ms{stop-color:#1f2819}
  .bg1.mm{stop-color:#4a3024}.bg2.mm{stop-color:#2e1d16}.bg1.ma{stop-color:#30334a}.bg2.ma{stop-color:#1d1f2e}
}
/* Einkauf */
.listhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.catttl{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:16px 4px 6px}
.items{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:56px;padding:8px 14px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.check{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent;font-size:15px;font-weight:900}
.item.done .check{background:var(--ok);border-color:var(--ok);color:#fff}
.item .nm{flex:1;min-width:0}
.item .nm div:first-child{font-weight:600}
.item .src{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .amt{font-weight:650;white-space:nowrap;font-variant-numeric:tabular-nums}
.item.done .nm,.item.done .amt{opacity:.45;text-decoration:line-through}
details.pantry{margin-top:18px}
details.pantry summary{list-style:none;cursor:pointer;min-height:44px;display:flex;align-items:center;justify-content:space-between;font-weight:700}
details.pantry summary::-webkit-details-marker{display:none}
details.pantry summary::after{content:"▾";color:var(--muted);transition:transform .15s}
details.pantry[open] summary::after{transform:rotate(180deg)}

/* Favoriten/Verlauf */
.hist{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.hist button{display:flex;width:100%;gap:12px;align-items:center;min-height:52px;padding:8px 14px;border-bottom:1px solid var(--line);text-align:left}
.hist button:last-child{border-bottom:0}
.hist .d{font-size:13px;color:var(--muted);width:88px;flex:none;font-variant-numeric:tabular-nums}

/* Tabbar */
nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:space-around;
  padding:4px calc(var(--sr) + 8px) var(--sb) calc(var(--sl) + 8px);height:calc(var(--tabh) + var(--sb));
  background:color-mix(in srgb,var(--surface) 86%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
nav.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);position:relative;min-height:44px}
nav.tabbar button[aria-selected="true"]{color:var(--accent)}
nav.tabbar svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tbcount{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:800;display:grid;place-items:center}
.tbcount:empty{display:none}

.toast{position:fixed;left:50%;bottom:calc(var(--tabh) + var(--sb) + 14px);transform:translate(-50%,20px);opacity:0;z-index:90;
  background:var(--text);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:15px;font-weight:600;max-width:calc(100% - 32px);
  transition:opacity .2s,transform .2s;pointer-events:none;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sheet-open .toast{bottom:calc(var(--sb) + 86px)}
.hint{display:flex;gap:12px;align-items:flex-start;background:var(--accent-soft);border-radius:var(--r);padding:12px 6px 12px 14px;margin-bottom:12px;font-size:14px}
.hint .grow b{display:block;margin-bottom:2px}
.hint .iconbtn{flex:none;width:36px;height:36px;background:transparent;font-size:18px}
</style>
</head>
<body>

<section class="tab active" id="tab-vorschlag">
  <div class="topbar">
    <div><h1>Was koche ich?</h1><div class="sub" id="greet"></div></div>
  </div>
  <div class="hint hidden" id="installHint">
    <div class="grow"><b>Als App installieren</b>In Safari unten auf <b style="display:inline">Teilen</b> tippen, dann „Zum Home-Bildschirm“.</div>
    <button class="iconbtn" data-act="hideHint" aria-label="Hinweis schließen">✕</button>
  </div>
  <div class="panel" id="filters"></div>
  <button class="cta" data-act="suggest"><span>Vorschlag</span><span class="cnt" id="matchCount"></span></button>
  <div id="results"></div>
</section>

<section class="tab" id="tab-einkauf">
  <div class="topbar"><div><h1>Einkauf</h1><div class="sub" id="listSub"></div></div></div>
  <div class="excl" style="margin-bottom:12px">
    <input id="customItem" type="text" placeholder="Eigenen Artikel hinzufügen" enterkeyhint="done" autocomplete="off">
    <button data-act="addCustom">+</button>
  </div>
  <div id="list"></div>
  <div class="row wrap" id="listActions" style="margin-top:14px">
    <button class="btn primary grow" data-act="share">Teilen</button>
    <button class="btn grow" data-act="clearDone">Erledigte löschen</button>
    <button class="btn ghost danger" data-act="clearAll">Alles löschen</button>
  </div>
  <details class="pantry panel" id="pantryBox">
    <summary>Habe ich schon da <span class="muted small" id="pantryCount"></span></summary>
    <p class="muted small" style="margin:4px 0 10px">Markierte Grundvorräte kommen nicht mehr auf die Einkaufsliste. Im Rezept bleiben sie mit „Vorrat“ gekennzeichnet und in den Kosten enthalten.</p>
    <div class="chips" id="pantryChips"></div>
  </details>
</section>

<section class="tab" id="tab-favoriten">
  <div class="topbar"><div><h1>Favoriten</h1><div class="sub" id="favSub"></div></div></div>
  <div class="cards" id="favList"></div>
  <div class="listhead" style="margin-top:26px"><h2>Verlauf</h2><button class="btn ghost danger" data-act="clearHist" id="clearHistBtn">Leeren</button></div>
  <div id="histList"></div>
</section>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
<div class="actionbar" id="actionbar">
  <button class="btn primary" data-act="addToList">Zur Einkaufsliste</button>
  <button class="btn" data-act="cooked">Gekocht</button>
</div>

<nav class="tabbar" role="tablist">
  <button role="tab" data-tab="vorschlag" aria-selected="true">
    <svg viewBox="0 0 24 24"><path d="M4 11h16a8 8 0 0 1-16 0Z"/><path d="M2 11h20"/><path d="M9 3c-1 1.3 1 2.7 0 4M13 3c-1 1.3 1 2.7 0 4"/></svg>Vorschlag</button>
  <button role="tab" data-tab="einkauf" aria-selected="false">
    <svg viewBox="0 0 24 24"><path d="M6 7h12l-1 13H7L6 7Z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>Einkauf<span class="tbcount" id="tbCount"></span></button>
  <button role="tab" data-tab="favoriten" aria-selected="false">
    <svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z"/></svg>Favoriten</button>

lzen und pfeffern.","Gurke in Scheiben schneiden und mit Quark und Knäckebrot servieren."]},{"id":"s06","n":"Schoko-Dattel-Energy-Balls","m":"s","t":[15,0],"r":"30 Min. kühlen","e":1,"eq":[],"i":[["datteln",40],["haferflocken",30],["erdnussbutter",15],["kakao",5],["salz",1]],"s":["Datteln sehr fein hacken oder mit einem Pürierstab zerkleinern.","Mit Haferflocken, Erdnussbutter, Kakao und Salz zu einer klebrigen Masse verkneten. Ist sie zu trocken, 1 TL Wasser zugeben.","Mit feuchten Händen walnussgroße Kugeln formen und 30 Minuten kalt stellen."]},{"id":"s07","n":"Süßkartoffel-Pommes mit Joghurtdip","m":"s","t":[8,20],"e":1,"eq":["airfryer|ofen"],"i":[["suesskartoffel",250],["rapsoel",1],["paprikapulver",0.5],["salz",1],["joghurt",60],["knoblauch",0.5],["pfeffer",1]],"s":["Süßkartoffel schälen und in gleich dicke Stifte schneiden, mit Öl, Paprikapulver und Salz mischen.",["Im Airfryer bei 200 °C garen, mehrmals schütteln. Backofen: 220 °C Umluft, ca. 25 Minuten, einmal wenden.",20],"Joghurt mit gepresstem Knoblauch, Salz und Pfeffer verrühren und zu den Pommes servieren."]},{"id":"s08","n":"Schoko-Tassenkuchen","m":"s","t":[3,2],"e":1,"eq":["mikro"],"i":[["mehl",40],["zucker",20],["kakao",10],["backpulver",0.25],["milch",50],["rapsoel",2],["schoko",10]],"s":["Mehl, Zucker, Kakao und Backpulver in einer großen Tasse mischen, dann Milch und Öl glatt einrühren.",["Schokostückchen in die Mitte drücken und bei 800 W ca. 70–90 Sekunden garen.",2],"Eine Minute abkühlen lassen und direkt aus der Tasse essen."]},{"id":"s09","n":"Burrata mit Tomaten & Baguette","m":"s","t":[8,0],"e":1,"eq":[],"i":[["burrata",1],["cherry",150],["rucola",20],["pesto",15],["olivenoel",1],["baguette",0.4],["salz",1],["pfeffer",1]],"s":["Cherrytomaten halbieren, mit Rucola auf einem Teller verteilen, salzen und pfeffern.","Burrata in die Mitte setzen, mit Pesto und Olivenöl beträufeln.","Mit in Scheiben geschnittenem Baguette servieren."]},{"id":"s10","n":"Räucherlachs-Wrap","m":"s","t":[8,0],"e": // Gemeinsame Gesundheitsbewertung (wird auch in index.html eingebettet)
function healthOf(r, CAT, NUT, VEG) {
  let kcal = 0, prot = 0, fib = 0, sug = 0, sat = 0, veg = 0;
  for (const [k, a] of r.i) {
    const c = CAT[k], g = a * c[4], n = NUT[k];
    kcal += g / 100 * c[5]; prot += g / 100 * c[6];
    fib += g / 100 * n[0]; sug += g / 100 * n[1]; sat += g / 100 * n[2];
    if (VEG.includes(k)) veg += g;
  }
  const main = r.m === "m" || r.m === "a";
  const kr = { f: [300, 650], s: [100, 450], m: [450, 850], a: [450, 850] }[r.m];
  const pE = prot * 4 / kcal * 100, sE = sat * 9 / kcal * 100, zE = sug * 4 / kcal * 100;
  const step = (v, full, half, hi) => hi ? (v >= full ? 1 : v >= half ? 0.5 : 0) : (v <= full ? 1 : v <= half ? 0.5 : 0);
  const crit = [
    { k: "Gemüse & Obst", v: Math.round(veg) + " g", ziel: "≥ " + (main ? 200 : 100) + " g", p: step(veg, main ? 200 : 100, main ? 100 : 50, true) },
    { k: "Ballaststoffe", v: (Math.round(fib * 10) / 10) + " g", ziel: "≥ " + (main ? 8 : 5) + " g", p: step(fib, main ? 8 : 5, main ? 5 : 3, true) },
    { k: "Protein-Anteil", v: Math.round(pE) + " %", ziel: "≥ 15 % kcal", p: step(pE, 15, 10, true) },
    { k: "Gesättigte Fette", v: Math.round(sE) + " %", ziel: "≤ 10 % kcal", p: step(sE, 10, 15, false) },
    { k: "Zuckerzusatz", v: Math.round(zE) + " %", ziel: "≤ 5 % kcal", p: step(zE, 5, 10, false) },
    { k: "Energie", v: Math.round(kcal) + " kcal", ziel: kr[0] + "–" + kr[1] + " kcal",
      p: kcal >= kr[0] && kcal <= kr[1] ? 1 : kcal >= kr[0] * 0.8 && kcal <= kr[1] * 1.2 ? 0.5 : 0 }
  ];
  return { crit, score: crit.reduce((s, c) => s + c.p, 0) };
}

const CATNAME = Object.fromEntries(CATS);
const CATORDER = Object.fromEntries(CATS.map((c, i) => [c[0], i]));
const MEALS = { f: "Frühstück", s: "Snack", m: "Mittagessen", a: "Abendessen" };
const EFFORT = { 1: "einfach", 2: "mittel", 3: "anspruchsvoll" };

const DAY = 86400000;

// Kennzahlen je Portion aus dem Zutatenkatalog berechnen
const R = DB.recipes.map(r => {
  let cost = 0, kcal = 0, prot = 0, meat = false, animal = false;
  for (const [k, a] of r.i) {
    const c = CAT[k];
    cost += a * c[3]; kcal += a * c[4] / 100 * c[5]; prot += a * c[4] / 100 * c[6];
    if (c[7].includes("m")) meat = true;
    if (c[7].includes("a") || c[7].includes("m")) animal = true;
  }
  return Object.assign({}, r, {
    cost, kcal, prot, veg: !meat, vegan: !animal,
    pr: prot >= 20 && prot * 4 / kcal >= 0.2,          // proteinreich: ≥ 20 g und ≥ 20 % der Energie
    tt: r.t[0] + r.t[1],
    h: healthOf(r, CAT, NUT, VEG)
  });
});
const RBYID = Object.fromEntries(R.map(r => [r.id, r]));

/* ---------- Zustand ---------- */
const KEY = "wkc.v1";

const DEF = {
  f: { meal: defaultMeal(), budget: "egal", time: "egal", serv: 2, diet: "alles", health: "egal", effort: 3, eq: ["herd", "ofen", "airfryer", "mikro"], kalt: false },
  excl: [], fav: [], hist: [], list: [], pantry: ["salz", "pfeffer"], hintClosed: false

try { S = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { S = {}; }

/* ---------- Hilfsfunktionen ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nf = (d) => new Intl.NumberFormat("de-DE", { minimumFractionDigits: d, maximumFractionDigits: d });
const NF2 = nf(2), NF0 = nf(0);

const FRAC = { 0.25: "¼", 0.5: "½", 0.75: "¾" };
function fracStr(x) {
  const q = Math.round(x * 4) / 4 || 0.25, w = Math.floor(q), f = +(q - w).toFixed(2);
  return f ? (w ? w + FRAC[f] : FRAC[f]) : String(w);
}
function unitLabel(u, n) {
  if (n > 1) return { Zehe: "Zehen", Scheibe: "Scheiben", Prise: "Prisen" }[u] || u;
  return u;
}
// Menge im Rezept
function fmtRecipe(a, u) {
  if (u === "g" || u === "ml") {
    const v = a < 20 ? Math.max(1, Math.round(a)) : a < 100 ? Math.round(a / 5) * 5 : Math.round(a / 10) * 10;
    return v >= 1000 ? nf(v % 1000 ? 2 : 0).format(v / 1000).replace(/,?0+$/, "") + (u === "g" ? " kg" : " l") : v + " " + u;
  }
  if (u === "Prise") { const n = Math.max(1, Math.round(a)); return n + " " + unitLabel(u, n); }
  const q = Math.round(a * 4) / 4 || 0.25;
  return fracStr(q) + " " + unitLabel(u, q);
}
// Menge auf der Einkaufsliste (auf kaufbare Einheiten aufrunden)
function fmtShop(a, u) {
  if (a == null) return "";
  if (u === "g" || u === "ml") {
    const v = a < 20 ? Math.ceil(a) : a < 100 ? Math.ceil(a / 5) * 5 : Math.ceil(a / 10) * 10;
    return v >= 1000 ? nf(2).format(v / 1000).replace(/,?0+$/, "") + (u === "g" ? " kg" : " l") : v + " " + u;
  }
  if (u === "EL" || u === "TL") { const q = Math.ceil(a * 2 - 1e-9) / 2; return fracStr(q) + " " + u; }
  const n = Math.max(1, Math.ceil(a - 1e-9));
  return n + " " + unitLabel(u, n);
}
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function lastCooked(id) { let t = 0; for (const h of S.hist) if (h.id === id && h.ts > t) t = h.ts; return t; }
function daysAgo(ts) { const d0 = new Date(); d0.setHours(0, 0, 0, 0); const d1 = new Date(ts); d1.setHours(0, 0, 0, 0); return Math.round((d0 - d1) / DAY); }
function recentSet() { const lim = Date.now() - 7 * DAY, s = new Set(); for (const h of S.hist) if (h.ts >= lim) s.add(h.id); return s; }
const ICON = {
  clock: '<svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  euro: '<svg class="ico" viewBox="0 0 24 24"><path d="M17 6.5A7 7 0 1 0 17 17.5"/><path d="M4 10h9M4 14h9"/></svg>',
  flame: '<svg class="ico" viewBox="0 0 24 24"><path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2.5 1.5-4 2.5-5 .3 2 1.5 3 2.5 3 0-3-1-5 0-8Z"/></svg>',
  hat: '<svg class="ico" viewBox="0 0 24 24"><path d="M7 18h10v3H7zM7 18v-4.5A4 4 0 0 1 8 6a4.5 4.5 0 0 1 8 0 4 4 0 0 1 1 7.5V18"/></svg>'

let toastT;

/* ---------- Kosten mit Rundung pro Zeile (Summen stimmen sichtbar überein) ---------- */
function costLines(r, serv) {
  return r.i.map(([k, a]) => { const c = CAT[k]; const amt = a * serv; return { k, amt, c, cents: Math.round(amt * c[3] * 100) }; });
}
function totalCents(r, serv) { return costLines(r, serv).reduce((s, l) => s + l.cents, 0); }
function perPortionCents(r, serv) { return Math.round(totalCents(r, serv) / serv); }

/* ---------- Ausschlüsse ---------- */
const norm = s => s.toLowerCase().trim();
function termHits(term, word) {
  return word === term || (term.length >= 3 && word.startsWith(term)) || (word.length >= 4 && term.startsWith(word));
}
function recipeExcluded(r) {
  if (!S.excl.length) return false;
  const words = new Set(norm(r.n).split(/[^a-zäöüß]+/).filter(Boolean));
  for (const [k] of r.i) {
    const c = CAT[k];
    norm(c[0]).split(/[^a-zäöüß]+/).filter(Boolean).forEach(w => words.add(w));
    c[8].forEach(t => words.add(t));
  }
  return S.excl.some(t => { t = norm(t); for (const w of words) if (termHits(t, w)) return true; return false; });
}

/* ---------- Filter ---------- */
function eqOk(r) {
  if (S.f.kalt) return r.eq.length === 0;
  return r.eq.every(alt => alt.split("|").some(a => S.f.eq.includes(a)));
}
function matches(r) {
  const f = S.f;
  if (r.m !== f.meal) return false;
  if (f.budget === "guenstig" && !(r.cost < 2.5)) return false;
  if (f.budget === "mittel" && !(r.cost >= 2.5 && r.cost <= 5)) return false;
  if (f.time !== "egal" && r.tt > +f.time) return false;
  if (f.diet === "veg" && !r.veg) return false;
  if (f.diet === "vegan" && !r.vegan) return false;
  if (f.diet === "pr" && !r.pr) return false;
  if (f.health !== "egal" && r.h.score < +f.health) return false;
  if (r.e > f.effort) return false;
  if (!eqOk(r)) return false;
  if (recipeExcluded(r)) return false;
  return true;
}

const GROUPS = [
  { key: "meal", label: "Mahlzeit", seg: false, opts: [["f", "Frühstück"], ["s", "Snack"], ["m", "Mittagessen"], ["a", "Abendessen"]] },

  { key: "time", label: "Zubereitungszeit", seg: true, opts: [["15", "≤ 15"], ["30", "≤ 30"], ["60", "≤ 60"], ["egal", "egal"]], hint: "Minuten" },

  { key: "health", label: "Gesund & ausgewogen", seg: true, opts: [["egal", "egal"], ["4", "ausgewogen<small>≥ 4 von 6</small>"], ["5", "sehr gesund<small>≥ 5 von 6</small>"]], hint: "6 Kriterien pro Portion" },

      h += `<div class="fgroup"><div class="flabel"><span>Portionen</span><span>Mengen & Kosten skalieren</span></div>

function updateCount() {

}

/* ---------- Vorschläge (Swipe-Deck) ---------- */
let shown = [], deckIdx = 0;
function ordered(list) {
  const rec = recentSet();
  return shuffle(list.filter(r => !rec.has(r.id))).concat(
    list.filter(r => rec.has(r.id)).sort((a, b) => lastCooked(a.id) - lastCooked(b.id)));
}
function buildDeck() { shown = ordered(R.filter(matches)).map(r => r.id); deckIdx = 0; }
function fmtScore(x) { return String(x).replace(".", ","); }
function hLabel(x) { return x >= 5 ? "sehr gesund" : x >= 4 ? "ausgewogen" : "Genuss"; }
function recentTxt(id) { const lc = lastCooked(id); if (!lc) return ""; const da = daysAgo(lc); if (da > 7) return ""; return da === 0 ? "heute gekocht" : da === 1 ? "gestern gekocht" : `vor ${da} Tagen gekocht`; }
function deckCardHTML(r) {
  const pp = perPortionCents(r, S.f.serv), rt = recentTxt(r.id);
  const pills = [];
  if (r.vegan) pills.push(`<span class="pill veg">vegan</span>`); else if (r.veg) pills.push(`<span class="pill veg">vegetarisch</span>`);
  pills.push(`<span class="pill ${r.h.score >= 5 ? "veg" : ""}">${hLabel(r.h.score)} ${fmtScore(r.h.score)}/6</span>`);

function deckStep() { const d = $("#deck"), c = d && d.querySelector(".dcard"); return c ? c.offsetWidth + 12 : 1; }
function updateDeckPos() {

  $("#deckPrev").disabled = deckIdx === 0; $("#deckNext").disabled = deckIdx >= shown.length - 1;
}
function deckGo(i) { const d = $("#deck"); if (d) d.scrollTo({ left: Math.max(0, Math.min(shown.length - 1, i)) * deckStep(), behavior: "smooth" }); }
function renderResults(scroll) {
  const box = $("#results");
  shown = shown.filter(id => matches(RBYID[id]));
  if (!shown.length) {
    box.innerHTML = `<div class="panel empty"><b>Keine passenden Gerichte</b>Lockere Budget, Zeit, Aufwand, Gesundheit oder Ausstattung – oder entferne einen Ausschluss.</div>`;
  } else {
    box.innerHTML = `<div class="reshead"><span class="small muted"><b id="deckPos" style="color:var(--text)"></b> passende · für ${S.f.serv} ${S.f.serv === 1 ? "Portion" : "Portionen"}</span>
      ${shown.length > 1 ? '<button class="btn ghost" data-act="reroll">↻ Neu mischen</button>' : ""}</div>
      <div class="deck" id="deck">${shown.map(id => deckCardHTML(RBYID[id])).join("")}</div>
      <div class="deckctl ${shown.length > 1 ? "" : "hidden"}"><button id="deckPrev" data-act="deckPrev" aria-label="Vorheriges Gericht">‹</button>
        <div class="prog"><i id="deckProg"></i></div><button id="deckNext" data-act="deckNext" aria-label="Nächstes Gericht">›</button></div>
      <p class="muted small" style="text-align:center;margin:6px 0 0">Wischen zum Blättern · Tippen für Details</p>`;
    const d = $("#deck");
    d.addEventListener("scroll", () => requestAnimationFrame(updateDeckPos), { passive: true });
    d.scrollLeft = deckIdx * deckStep();
    updateDeckPos();
  }
  if (scroll) box.scrollIntoView({ behavior: "smooth", block: "start" });
}

/* ---------- Rezeptdetail ---------- */
let openId = null;
function openRecipe(id) {
  openId = id; renderSheet();
  const sh = $("#sheet"); sh.scrollTop = 0;
  requestAnimationFrame(() => { sh.classList.add("open"); $("#actionbar").classList.add("open"); });
  document.documentElement.classList.add("sheet-open"); document.body.style.overflow = "hidden";
}
function closeRecipe() {
  openId = null;
  $("#sheet").classList.remove("open"); $("#actionbar").classList.remove("open");
  document.documentElement.classList.remove("sheet-open"); document.body.style.overflow = "";
  refreshVisible();
}
function renderSheet() {
  const r = RBYID[openId]; if (!r) return;
  const serv = S.f.serv, lines = costLines(r, serv), tot = lines.reduce((s, l) => s + l.cents, 0), pp = Math.round(tot / serv);
  const fav = S.fav.includes(r.id);
  const eqTxt = r.eq.length ? r.eq.map(e => e.split("|").map(x => EQNAME[x]).join(" oder ")).join(" + ") : "nur kalt – kein Gerät nötig";
  const diet = r.vegan ? "vegan" : r.veg ? "vegetarisch" : "mit Fleisch/Fisch";
  const rows = lines.map(l => {
    const pantry = S.pantry.includes(l.k), hidden = l.c[7].includes("x");
    return `<tr><td class="a">${fmtRecipe(l.amt, l.c[2])}</td><td>${esc(l.c[0])}${pantry && !hidden ? '<span class="badge">Vorrat</span>' : ""}</td><td class="c">${hidden ? "" : eur(l.cents)}</td></tr>`;
  }).join("");
  const steps = r.s.map(s => Array.isArray(s)
    ? `<li>${esc(s[0])}<br><span class="tbadge">${ICON.clock}${s[1]} min</span></li>` : `<li>${esc(s)}</li>`).join("");
  $("#sheet").innerHTML = `
    <div class="sheet-top"><button class="iconbtn" data-act="close" aria-label="Schließen">✕</button>
      <button class="iconbtn" data-act="fav" aria-pressed="${fav}" aria-label="Favorit">${fav ? "♥" : "♡"}</button></div>
    <div class="hero">${DISH.svg(r)}</div>
    <div class="pills" style="margin-top:4px"><span class="pill">${MEALS[r.m]}</span><span class="pill ${r.veg ? "veg" : ""}">${diet}</span>${r.pr ? '<span class="pill">proteinreich</span>' : ""}</div>
    <h2 id="sheetTitle" style="margin-top:8px">${esc(r.n)}</h2>
    <div class="stats">
      <div class="stat"><div class="k">Zeit</div><div class="v">${r.tt} min</div><div class="x">${r.t[0]} Vorb. + ${r.t[1]} Kochen${r.r ? "<br>+ " + esc(r.r) : ""}</div></div>
      <div class="stat"><div class="k">Aufwand</div><div class="v">${EFFORT[r.e]}</div><div class="x">${esc(eqTxt)}</div></div>
      <div class="stat"><div class="k">Kosten / Portion</div><div class="v">${eur(pp)}</div><div class="x">${eur(tot)} für ${serv} Port. (geschätzt)</div></div>
      <div class="stat"><div class="k">Pro Portion</div><div class="v">${NF0.format(r.kcal)} kcal</div><div class="x">${NF0.format(r.prot)} g Protein</div></div>
    </div>
    <div class="row" style="justify-content:space-between">
      <h3>Zutaten</h3>
      <div class="stepper"><button data-act="serv" data-d="-1" aria-label="Weniger" ${serv <= 1 ? "disabled" : ""}>−</button>
      <output style="min-width:64px">${serv} Port.</output><button data-act="serv" data-d="1" aria-label="Mehr" ${serv >= 6 ? "disabled" : ""}>+</button></div>
    </div>
    <table class="ing"><tbody>${rows}
      <tr class="sum"><td></td><td>Summe (${serv} ${serv === 1 ? "Portion" : "Portionen"})</td><td class="c" style="color:var(--text)">${eur(tot)}</td></tr>
      <tr class="pp"><td></td><td>÷ ${serv} = pro Portion</td><td class="c">${eur(pp)}</td></tr>
    </tbody></table>
    <p class="muted small">Preise: Schätzung nach deutschen Discounter-Preisen, anteilig nach Verbrauch.</p>
    <h3 class="sec">Ausgewogenheit · ${fmtScore(r.h.score)} von 6</h3>
    <table class="ing hl"><tbody>
      <tr class="hd"><td>pro Portion</td><td class="c">Wert</td><td class="c">Ziel</td><td class="c">Punkte</td></tr>
      ${r.h.crit.map(c => `<tr><td>${c.k}</td><td class="c">${esc(c.v.replace(".", ","))}</td><td class="c">${esc(c.ziel)}</td>
        <td class="c pt p${String(c.p).replace(".", "")}">${c.p === 1 ? "✓ 1" : c.p === 0.5 ? "◐ ½" : "✗ 0"}</td></tr>`).join("")}
      <tr class="sum"><td>Summe</td><td></td><td></td><td class="c" style="color:var(--text)">${fmtScore(r.h.score)} / 6</td></tr>
    </tbody></table>
    <p class="muted small">≥ 5 = sehr gesund, ≥ 4 = ausgewogen, darunter Genuss. Orientierung an DGE- und WHO-Empfehlungen; Prozentwerte = Anteil an den kcal.</p>
    <h3 class="sec">Zubereitung</h3>
    <ol class="steps">${steps}</ol>`;
}

/* ---------- Einkaufsliste ---------- */
function addRecipeToList(r) {
  const serv = S.f.serv; let added = 0, skipped = 0;
  for (const [k, a] of r.i) {
    const c = CAT[k];
    if (c[7].includes("x")) continue;
    if (S.pantry.includes(k)) { skipped++; continue; }
    let it = S.list.find(x => x.k === k);
    if (!it) { it = { k, a: 0, done: false, src: [] }; S.list.push(it); }
    it.a += a * serv; it.done = false;
    if (!it.src.includes(r.n)) it.src.push(r.n);
    added++;
  }
  save(); updateBadge();
  toast(`${added} Zutaten hinzugefügt` + (skipped ? ` · ${skipped} als Vorrat übersprungen` : ""));
}
function itemInfo(it) {
  if (it.k.startsWith("x:")) return { name: it.name, cat: "sonst", unit: "" };
  const c = CAT[it.k]; return { name: c[0], cat: c[1], unit: c[2] };
}
function sortedGroups() {
  const groups = {};
  S.list.forEach((it, idx) => { const inf = itemInfo(it); (groups[inf.cat] = groups[inf.cat] || []).push({ it, idx, inf }); });
  return Object.keys(groups).sort((a, b) => CATORDER[a] - CATORDER[b])
    .map(cat => [cat, groups[cat].sort((x, y) => (x.it.done - y.it.done) || x.inf.name.localeCompare(y.inf.name, "de"))]);
}
function renderList() {
  const open = S.list.filter(x => !x.done).length, done = S.list.length - open;
  $("#listSub").textContent = S.list.length ? `${S.list.length} Artikel · ${open} offen · ${done} erledigt` : "";
  $("#listActions").classList.toggle("hidden", !S.list.length);
  if (!S.list.length) {
    $("#list").innerHTML = `<div class="panel empty"><b>Liste ist leer</b>Öffne ein Rezept und tippe auf „Zur Einkaufsliste“.</div>`;
  } else {
    $("#list").innerHTML = sortedGroups().map(([cat, arr]) => `<div class="catttl">${CATNAME[cat]}</div><div class="items">${arr.map(({ it, idx, inf }) =>
      `<button class="item ${it.done ? "done" : ""}" data-act="toggleItem" data-i="${idx}" aria-pressed="${it.done}">
        <span class="check">✓</span><span class="nm"><div>${esc(inf.name)}</div>${it.src && it.src.length ? `<div class="src">${esc(it.src.join(", "))}</div>` : ""}</span>
        <span class="amt">${fmtShop(it.a, inf.unit)}</span></button>`).join("")}</div>`).join("");
  }
  const basics = Object.entries(CAT).filter(([, c]) => c[7].includes("b")).sort((a, b) => a[1][0].localeCompare(b[1][0], "de"));
  $("#pantryChips").innerHTML = basics.map(([k, c]) => `<button class="chip sm" data-act="pantry" data-k="${k}" aria-pressed="${S.pantry.includes(k)}">${esc(c[0])}</button>`).join("");
  $("#pantryCount").textContent = `${S.pantry.length} markiert`;
  updateBadge();
}
function updateBadge() { const n = S.list.filter(x => !x.done).length; $("#tbCount").textContent = n ? n : ""; }
function listText() {
  let t = "Einkaufsliste – Was koche ich?\n";
  for (const [cat, arr] of sortedGroups()) {
    const open = arr.filter(x => !x.it.done); if (!open.length) continue;
    t += `\n${CATNAME[cat]}\n` + open.map(({ it, inf }) => `• ${inf.name}${it.a != null ? " – " + fmtShop(it.a, inf.unit) : ""}`).join("\n") + "\n";
  }
  return t.trim();
}
async function shareList() {
  if (!S.list.some(x => !x.done)) { toast("Keine offenen Artikel"); return; }
  const text = listText();
  if (navigator.share) {
    try { await navigator.share({ title: "Einkaufsliste", text }); } catch (e) { /* abgebrochen */ }
  } else if (navigator.clipboard) {
    try { await navigator.clipboard.writeText(text); toast("In die Zwischenablage kopiert"); } catch (e) { toast("Teilen nicht verfügbar"); }
  } else toast("Teilen nicht verfügbar");
}

/* ---------- Favoriten & Verlauf ---------- */
function renderFav() {
  const favs = S.fav.map(id => RBYID[id]).filter(Boolean);
  $("#favSub").textContent = favs.length ? `${favs.length} gespeichert` : "";
  $("#favList").innerHTML = favs.length ? favs.map(cardHTML).join("")
    : `<div class="panel empty"><b>Noch keine Favoriten</b>Tippe im Rezept auf ♡.</div>`;
  const hist = S.hist.slice().sort((a, b) => b.ts - a.ts).slice(0, 60).filter(h => RBYID[h.id]);
  const dfmt = new Intl.DateTimeFormat("de-DE", { weekday: "short", day: "2-digit", month: "2-digit" });
  $("#clearHistBtn").classList.toggle("hidden", !hist.length);
  $("#histList").innerHTML = hist.length ? `<div class="hist">${hist.map(h =>
    `<button data-act="open" data-id="${h.id}"><span class="d">${dfmt.format(new Date(h.ts))}</span><span class="grow">${esc(RBYID[h.id].n)}</span><span class="muted">›</span></button>`).join("")}</div>`
    : `<div class="panel empty"><b>Noch nichts gekocht</b>„Gekocht“ im Rezept trägt das Gericht hier ein.</div>`;
}

/* ---------- Navigation ---------- */
let curTab = "vorschlag";
function showTab(t) {
  curTab = t;
  document.querySelectorAll("section.tab").forEach(s => s.classList.toggle("active", s.id === "tab-" + t));
  document.querySelectorAll("nav.tabbar button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === t));
  window.scrollTo(0, 0);
  refreshVisible();
}
function refreshVisible() {
  if (curTab === "einkauf") renderList();
  else if (curTab === "favoriten") renderFav();
  else if (shown.length) renderResults(false);
}

/* ---------- Ereignisse ---------- */
document.addEventListener("click", e => {
  const tabBtn = e.target.closest("nav.tabbar button");
  if (tabBtn) { showTab(tabBtn.dataset.tab); return; }
  const el = e.target.closest("[data-act]"); if (!el) return;
  const d = el.dataset;
  switch (d.act) {
    case "setf": S.f[d.k] = d.k === "effort" ? +d.v : d.v; filterChanged(); break;
    case "serv": {
      S.f.serv = Math.min(6, Math.max(1, S.f.serv + +d.d)); save(); renderFilters();
      if (openId) renderSheet(); if (shown.length) renderResults(false); break;
    }
    case "eq": {
      if (S.f.kalt) { S.f.kalt = false; S.f.eq = []; }
      S.f.eq = S.f.eq.includes(d.v) ? S.f.eq.filter(x => x !== d.v) : S.f.eq.concat(d.v);
      if (!S.f.eq.length) S.f.kalt = true;
      filterChanged(); break;
    }
    case "kalt":
      S.f.kalt = !S.f.kalt;
      if (!S.f.kalt && !S.f.eq.length) S.f.eq = ["herd", "ofen", "airfryer", "mikro"];
      filterChanged(); break;
    case "addExcl": addExcl(); break;
    case "rmExcl": S.excl.splice(+d.i, 1); filterChanged(); break;
    case "suggest": buildDeck(); renderResults(true); break;
    case "reroll": buildDeck(); renderResults(false); break;
    case "deckPrev": deckGo(deckIdx - 1); break;
    case "deckNext": deckGo(deckIdx + 1); break;
    case "open": openRecipe(d.id); break;
    case "close": closeRecipe(); break;
    case "fav": {
      const i = S.fav.indexOf(openId);
      if (i >= 0) { S.fav.splice(i, 1); toast("Aus Favoriten entfernt"); } else { S.fav.unshift(openId); toast("Als Favorit gespeichert"); }
      save(); renderSheet(); break;
    }
    case "addToList": addRecipeToList(RBYID[openId]); break;
    case "cooked": S.hist.push({ id: openId, ts: Date.now() }); if (S.hist.length > 300) S.hist = S.hist.slice(-300); save(); toast("Im Verlauf gespeichert"); break;
    case "toggleItem": { const it = S.list[+d.i]; if (it) { it.done = !it.done; save(); renderList(); } break; }
    case "clearDone": { const n = S.list.filter(x => x.done).length; S.list = S.list.filter(x => !x.done); save(); renderList(); toast(n ? `${n} erledigte gelöscht` : "Nichts erledigt"); break; }
    case "clearAll": if (confirm("Ganze Einkaufsliste löschen?")) { S.list = []; save(); renderList(); } break;
    case "share": shareList(); break;
    case "addCustom": addCustom(); break;
    case "pantry": {
      const k = d.k, i = S.pantry.indexOf(k);
      if (i >= 0) S.pantry.splice(i, 1);
      else {
        S.pantry.push(k);
        const before = S.list.length; S.list = S.list.filter(x => x.k !== k);
        if (S.list.length < before) toast(`${CAT[k][0]} von der Liste entfernt`);
      }
      save(); renderList(); break;
    }
    case "clearHist": if (confirm("Verlauf löschen?")) { S.hist = []; save(); renderFav(); } break;
    case "hideHint": S.hintClosed = true; save(); $("#installHint").classList.add("hidden"); break;
  }
});
function addExcl() {
  const inp = $("#exclInput");
  const terms = inp.value.split(/[,;]/).map(s => s.trim()).filter(Boolean);
  for (const t of terms) if (!S.excl.some(x => norm(x) === norm(t))) S.excl.push(t);
  if (terms.length) filterChanged();
}
function addCustom() {
  const inp = $("#customItem"), v = inp.value.trim(); if (!v) return;
  const k = "x:" + norm(v);
  const ex = S.list.find(x => x.k === k);
  if (ex) ex.done = false; else S.list.push({ k, name: v, a: null, done: false, src: [] });
  inp.value = ""; save(); renderList();
}
document.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  if (e.target.id === "exclInput") { e.preventDefault(); addExcl(); setTimeout(() => $("#exclInput") && $("#exclInput").focus(), 0); }
  if (e.target.id === "customItem") { e.preventDefault(); addCustom(); }
});
document.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("dcard")) { e.preventDefault(); openRecipe(e.target.dataset.id); } });
document.addEventListener("keyup", e => { if (e.key === "Escape" && openId) closeRecipe(); });

/* ---------- Start ---------- */
(function init() {
  const h = new Date().getHours();
  $("#greet").textContent = (h < 11 ? "Guten Morgen" : h < 18 ? "Hallo" : "Guten Abend") + " – worauf hast du Lust?";
  const standalone = window.navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  if (ios && !standalone && !S.hintClosed) $("#installHint").classList.remove("hidden");
  renderFilters(); updateBadge();
  if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>
